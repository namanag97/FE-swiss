backend:
  name: github
  repo: namanag97/FE-swiss
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

publish_mode: editorial_workflow
media_folder: "marketing/public/blog/uploads"
public_folder: "/blog/uploads"

site_url: "https://sancalana.com"
display_url: "https://sancalana.com"
logo_url: "/favicon.svg"

collections:
  - name: "blog"
    label: "Blog"
    folder: "marketing/content/blog"
    extension: "mdx"
    format: "frontmatter"
    create: true
    slug: "{{slug}}"
    preview_path: "blog/{{slug}}"
    sortable_fields: ["date", "title", "author", "published"]
    view_filters:
      - label: "Drafts"
        field: "published"
        pattern: false
      - label: "Published"
        field: "published"
        pattern: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string", required: false, hint: "Used by the CMS while creating the file name. The site URL comes from the file name." }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "Updated At", name: "updatedAt", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false }
      - { label: "Author", name: "author", widget: "select", options: ["Naman Agarwal", "Sancalana Team"], default: "Naman Agarwal" }
      - { label: "Tags", name: "tags", widget: "select", multiple: true, options: ["announcement", "engineering", "insights", "process-mining", "product", "research", "team"] }
      - { label: "Published", name: "published", widget: "boolean", default: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Canonical URL", name: "canonical", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
